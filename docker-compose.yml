version: '3.8'
services:
  app:
    build: .
    ports:
      - "1000:9090"
      - "9443:9443"
    environment:
      - serverName=db
    depends_on:
      - db

  db:
    image: postgres
    environment:
      - POSTGRES_DB=innovaTech
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432"